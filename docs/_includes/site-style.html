<style>
  /*
    Blog styles. The shared part (colors, links, top bar, buttons, headings) is copied from
    docs/index.html on purpose, so the blog looks the same as the top page. When you change
    those parts in index.html, update them here too.
  */
  :root {
    --bg: #0b0c0f;
    --fg: #e9eef2;
    --muted: #9aa4ad;
    --line: #1a1c22;
    --accent: #84a6ff;
    --pad: 22px;
    --max: 860px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --fg: #0b0c0f;
      --muted: #5c6670;
      --line: #dfe4ea;
      --accent: #1a4bff;
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    overflow-x: hidden;
    width: 100%;
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
  }

  a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 0;
  }

  a:hover {
    color: var(--accent);
  }

  .wrap {
    max-width: var(--max);
    margin: 0 auto;
    padding: calc(var(--pad) * 1.5) var(--pad) calc(var(--pad) * 0.6) var(--pad);
  }

  .nowrap {
    white-space: nowrap;
  }

  /* --- Shared with index.html: top bar, buttons, footer --- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    color: var(--muted);
    padding-bottom: calc(var(--pad) * 1.2);
  }

  .topbar .mark {
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .topbar .mark:hover {
    color: var(--accent);
  }

  .topnav {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .lang {
    display: flex;
    gap: 6px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    font-size: 0.85rem;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }

  .chip:hover {
    color: var(--fg);
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  footer {
    padding: calc(var(--pad) * 0.6) 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  /* --- Blog: page header (same look as the name block on the top page) --- */
  .post-head {
    padding-bottom: 8px;
  }

  .post-head .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .post-head h1 {
    margin: 10px 0 6px;
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .post-date {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .rule {
    width: 48px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin: 20px 0 0;
  }

  .post-nav {
    padding: 40px 0 24px;
  }

  .ad-slot {
    margin: calc(var(--pad) * 0.6) 0;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* --- Blog: list of posts (/blog/) --- */
  .post-list {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
    display: grid;
    gap: 20px;
  }

  .post-body .post-list a {
    display: block;
    color: var(--fg);
    opacity: 1;
  }
  
  .post-body .post-list a:hover {
    color: var(--accent);
  }

  .post-list .title {
    display: block;
    font-weight: 600;
    font-size: 1.05rem;
  }

  .post-list .title::after {
    content: "→";
    margin-left: 0.35em;
    font-weight: 400;
    color: var(--muted);
  }

  .post-list a:hover .title::after {
    color: var(--accent);
  }

  .post-list .date {
    display: block;
    color: var(--muted);
    font-size: 0.92rem;
  }

  /* --- Blog: article body --- */
  .lead {
    color: var(--muted);
    max-width: 62ch;
  }

  .post-body section {
    padding: 24px 0;
  }

  /* Headings get the same short accent line as the sections on the top page */
  .post-body h2 {
    margin: 16px 0 20px;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
  }

  .post-body h2::after {
    content: "";
    display: block;
    width: 32px;
    height: 3px;
    margin-top: 10px;
    border-radius: 2px;
    background: var(--accent);
  }

  .post-body h3 {
    margin: 24px 0 12px 0;
    font-weight: 600;
    font-size: 1.15rem;
  }

  .post-body p {
    margin-bottom: 1.5em;
  }

  .post-body img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }

  /* Links inside articles are shown in the accent color (no underline, no arrow) */
  .post-body a {
    color: var(--accent);
  }

  .post-body a:hover {
    opacity: 0.75;
  }

  .muted {
    color: var(--muted);
    font-size: 0.92rem;
  }

  /* Lists of papers / benchmarks inside articles (same structure as the top page) */
  .pubs {
    display: grid;
    gap: 16px;
    margin-bottom: 1.5em;
  }

  .pub .title {
    font-weight: 600;
  }

  .pub .meta {
    color: var(--muted);
    font-size: 0.92rem;
  }

  .post-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 24px 0;
    font-size: 0.95rem;
  }

  .post-body th {
    text-align: left;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    padding: 12px 8px;
    font-weight: 500;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .post-body td {
    border-bottom: 1px solid var(--line);
    padding: 16px 8px;
    vertical-align: top;
  }

  .post-body td strong {
    font-weight: 600;
  }

  @media (max-width: 640px) {
    .wrap {
      padding: calc(var(--pad) * 1.2) calc(var(--pad) * 0.8) calc(var(--pad) * 0.6) calc(var(--pad) * 0.8);
    }

    .post-head h1 {
      font-size: 1.7rem;
    }

    .post-body th, .post-body td {
      display: block;
      width: 100%;
      border-bottom: none;
      padding: 4px 0;
    }

    .post-body th {
      display: none;
    }

    .post-body tr {
      display: block;
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
      margin-bottom: 12px;
    }
  }
</style>
